<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="kandona 的电子书宝库：按书名、作者和分类搜索电子书目录。">
  <meta name="theme-color" content="#b72732">
  <title>电子书宝库 · kandona</title>
  <link rel="stylesheet" href="styles.css">
  <script src="search.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#search-input">跳到搜索</a>
  <header class="site-header page-width">
    <a class="brand" href="./" aria-label="电子书宝库首页">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Z"/><path d="M12 6v14"/></svg></span>
      <span>电子书宝库<small>KANDONA'S LIBRARY</small></span>
    </a>
    <nav aria-label="主导航"><a class="nav-current" href="#search-input">找一本书</a><a href="https://github.com/kandona/ebook-treasure-chest" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></nav>
  </header>
  <main class="page-width">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow"><span aria-hidden="true"></span> KANDONA · 电子书目录</p>
      <h1 id="page-title">下一本好书，<span>从这里开始。</span></h1>
      <p class="hero-description">书名、作者、分类，找到你想读的那一本。</p>
      <form id="search-form" role="search" class="search-form">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <label class="sr-only" for="search-input">搜索书名、作者或分类</label>
        <input id="search-input" type="search" placeholder="搜索书名、作者或分类…" autocomplete="off" aria-describedby="search-hint" enterkeyhint="search">
        <button id="clear-search" class="clear-search" type="button" aria-label="清空搜索" hidden>×</button>
        <button class="search-submit" type="submit">搜索<span aria-hidden="true"> →</span></button>
      </form>
      <p id="search-hint" class="search-hint">多个关键词用空格分隔，例如「历史 中国」</p>
      <div class="library-stats" aria-label="书库概览"><span><strong id="total-books">24,071</strong> 条书籍记录</span><i aria-hidden="true"></i><span><strong id="total-categories">1,000</strong> 个分类</span><i aria-hidden="true"></i><span>EPUB · MOBI · AZW3</span></div>
    </section>
    <section class="collection" aria-labelledby="results-title">
      <div class="section-heading"><div><p class="eyebrow">THE COLLECTION</p><h2 id="results-title">随便逛逛</h2></div><p id="result-count" role="status" aria-live="polite">正在加载书籍目录…</p></div>
      <div id="category-filters" class="category-filters" role="group" aria-label="按分类筛选"><button type="button" class="category-button is-active" data-category="" aria-pressed="true">全部</button><button type="button" class="category-button" data-category="文学" aria-pressed="false">文学</button><button type="button" class="category-button" data-category="历史" aria-pressed="false">历史</button><button type="button" class="category-button" data-category="科普" aria-pressed="false">科普</button><button type="button" class="category-button" data-category="管理" aria-pressed="false">管理</button><button type="button" class="category-button" data-category="社会" aria-pressed="false">社会</button><button type="button" class="category-button" data-category="推理" aria-pressed="false">推理</button><button type="button" class="category-button" data-category="经典" aria-pressed="false">经典</button><button type="button" class="category-button" data-category="经济" aria-pressed="false">经济</button></div>
      <div id="data-notice" class="data-notice" role="status" hidden></div>
      <div id="search-results" class="book-grid" aria-busy="true"><div class="state-panel"><span class="loading-dot" aria-hidden="true"></span><h3>正在打开书库</h3><p>首次访问需要加载目录，请稍候。</p></div></div>
      <div class="more-row"><button id="show-more" class="more-button" type="button" hidden>再看一些 <span aria-hidden="true">↓</span></button></div>
      <noscript><p class="state-panel">请启用 JavaScript 以搜索书籍，也可以前往 <a href="https://github.com/kandona/ebook-treasure-chest/tree/main/md">GitHub 分类目录</a>浏览。</p></noscript>
    </section>
    <aside class="catalog-note"><span aria-hidden="true">↗</span><p>这里是书籍目录，下载将前往外部网盘。文件可用性以网盘页面为准。</p></aside>
  </main>
  <footer class="site-footer page-width"><p>电子书宝库 <span> / </span> kandona</p><div><a href="https://github.com/kandona/ebook-treasure-chest/blob/main/README.md" target="_blank" rel="noopener noreferrer">使用说明 ↗</a><a href="https://github.com/jbiaojerry/ebook-treasure-chest" target="_blank" rel="noopener noreferrer">原项目 ↗</a></div></footer>
</body>
</html>
